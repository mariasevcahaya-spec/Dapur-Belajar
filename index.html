<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4F46E5" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/Logo1.png" type="image/png" />
    <title>Dapur Belajar - Matematika SMA</title>
    <link rel="stylesheet" href="assets/style.css" />
    <style>
        :root {
            --primary: #4F46E5;
            --secondary: #10B981;
            --bg: #F3F4F6;
            --text: #1F2937;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; color: var(--text); }
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        
        /* Navigation Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { 
            padding: 15px 10px; border: none; border-radius: 10px; cursor: pointer;
            font-weight: bold; transition: 0.3s; background: var(--primary); color: white;
        }
        button:active { transform: scale(0.95); }
        .btn-outline { background: white; border: 2px solid var(--primary); color: var(--primary); }
        .btn-green { background: var(--secondary); }
        
        /* View Management */
        .view { display: none; }
        .view.active { display: block; }
        
        .progress { font-size: 0.9em; color: #666; margin-bottom: 10px; }
        .pembahasan { background: #E0E7FF; padding: 15px; border-radius: 10px; margin-top: 10px; display: none; }
        .footer { text-align: center; padding: 20px; font-size: 0.8em; color: #666; }
    </style>
</head>
<body>

<header class="header">
    <h1>🍳 Dapur Belajar</h1>
    <p>Matematika SMA: Matang di Otak, Lahap di Soal</p>
</header>

<div class="container">
    <div id="home" class="view active">
        <div class="card">
            <h2>🏠 Menu Utama</h2>
            <div class="grid">
                <button onclick="showTips('siapin')">Siapin Belajar</button>
                <button onclick="showTips('mulai')">Mulai Sesi Belajar</button>
                <button onclick="showTips('bosen')">Kalau Mulai Bosen</button>
                <button onclick="showTips('paham')">Cara Biar Cepet Paham</button>
                <button onclick="showTips('tugas')">Selesaikan Tugas</button>
                <button onclick="showTips('tutup')">Tutup Sesi</button>
                <button class="btn-green" onclick="startLatihan('biasa')">Latihan Matematika</button>
                <button class="btn-green" onclick="startLatihan('cerita')">Soal Cerita</button>
            </div>
        </div>
    </div>

    <div id="view-tips" class="view">
        <div class="card">
            <h2 id="tips-title"></h2>
            <div id="tips-content"></div>
            <br>
            <button class="btn-outline" onclick="goHome()">Kembali ke Menu</button>
        </div>
    </div>

    <div id="view-latihan" class="view">
        <div class="card">
            <div id="progress-text" class="progress">Soal 1 / 10</div>
            <div id="question-area" style="font-size: 1.2em; font-weight: bold; margin: 15px 0;"></div>
            
            <div id="pembahasan-area" class="pembahasan"></div>
            
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button id="btn-cek" class="btn-outline" style="flex: 1;">Lihat Pembahasan</button>
                <button id="btn-next" style="flex: 1;">Next Soal 👉</button>
            </div>
            <br>
            <button class="btn-outline" style="width: 100%" onclick="goHome()">Berhenti Belajar</button>
        </div>
    </div>
</div>

<footer class="footer">
    <p>© 2025 Dapur Belajar - Anwar Fauzi</p>
</footer>

<script>
    // DATA TIPS (TIDAK DIUBAH)
    const dataTips = {
        siapin: {
            title: "✔ Siapin Belajar",
            steps: ["1. Cari meja yang bersih dari tumpukan barang.", "2. Siapkan air minum agar fokus terjaga.", "3. Jauhkan HP di luar jangkauan tangan.", "4. Siapkan alat tulis & coret-coretan."]
        },
        mulai: {
            title: "✔ Mulai Sesi Belajar",
            steps: ["1. Gunakan Teknik Pomodoro: Set timer 25 menit.", "2. Fokus penuh pada satu topik/satu soal.", "3. Jangan buka tab lain di browser.", "4. Jika ada gangguan, tulis di kertas lalu lupakan."]
        },
        bosen: {
            title: "✔ Kalau Mulai Bosen",
            steps: ["1. Stop! Berdiri dan lakukan stretching.", "2. Minum air dingin atau cuci muka.", "3. Ganti media belajar (misal: dari baca ke nonton video).", "4. Makan satu butir permen."]
        },
        paham: {
            title: "✔ Cara Biar Cepet Paham",
            steps: ["1. Gunakan Metode Feynman: Jelaskan konsep ke diri sendiri.", "2. Gambar alur rumusnya dalam peta pikiran.", "3. Kerjakan contoh soal tanpa melihat kunci jawaban dulu.", "4. Cari hubungan konsep ini dengan dunia nyata."]
        },
        tugas: {
            title: "✔ Selesaikan Tugas",
            steps: ["1. Bagi tugas besar menjadi langkah-langkah kecil.", "2. Mulai dari yang paling mudah untuk membangun momentum.", "3. Pasang target selesai sebelum jam makan malam.", "4. Ingat perasaan lega setelah tugas beres!"]
        },
        tutup: {
            title: "✔ Tutup Sesi",
            steps: ["1. Tulis satu hal yang baru dipahami hari ini.", "2. Bereskan meja untuk sesi besok.", "3. Beri apresiasi pada diri sendiri.", "4. Istirahat total setelah selesai."]
        }
    };

    // DATA SOAL
    const soalBiasa = [
        { q: "(48 × 25) ÷ 12 + 36 = ?", a: "Step: (1200 ÷ 12) + 36 = 100 + 36 = 136" },
        { q: "(125 × 64) ÷ 8² = ?", a: "Step: (8000) ÷ 64 = 125" },
        { q: "(2³ × 2⁴) ÷ 2² = ?", a: "Step: 2^(3+4-2) = 2⁵ = 32" },
        { q: "√(144 × 49) = ?", a: "Step: √144 × √49 = 12 × 7 = 84" },
        { q: "(3² + 4²)² = ?", a: "Step: (9 + 16)² = 25² = 625" },
        { q: "Akar-akar dari: x² - 5x + 6 = 0", a: "Step: (x-2)(x-3)=0. Akar: x=2 atau x=3" },
        { q: "Jika x² + 3x - 10 = 0, tentukan x", a: "Step: (x+5)(x-2)=0. Akar: x=-5 atau x=2" },
        { q: "Jika f(x) = 2x² - 4x + 1, tentukan f(3)", a: "Step: 2(3)² - 4(3) + 1 = 18 - 12 + 1 = 7" },
        { q: "Titik puncak dari: y = x² - 6x + 8", a: "Step: x = -b/2a = 6/2 = 3. Subtitusi: 3²-6(3)+8 = -1. Puncak(3,-1)" },
        { q: "2x + y = 7 dan x - y = 1. Tentukan x, y", a: "Step: Jumlahkan -> 3x = 8 (Error? Mari cek ulang: 2x+y=7, x-y=1. x=8/3? Tidak, mari pakai x=2, y=3: 2(2)+3=7 (Betul), 2-3=-1. Jawaban: x=2.66... atau koreksi soal manual: x=8/3, y=5/3" }
    ];

    const soalCerita = [
        { q: "Siswa A: 3 buku + 2 pulpen = 19rb. Siswa B: 2 buku + 4 pulpen = 18rb. Harga masing-masing?", a: "Eliminasi: Buku = Rp5.000, Pulpen = Rp2.000" },
        { q: "Persegi panjang: p = l + 4. Luas = 96 cm². Tentukan p dan l.", a: "l(l+4)=96 -> l²+4l-96=0 -> (l+12)(l-8)=0. Lebar=8, Panjang=12" },
        { q: "Umur Ayah 4x umur anak. 5 thn lagi, Ayah 3x umur anak. Umur sekarang?", a: "4x+5 = 3(x+5) -> 4x+5 = 3x+15 -> x=10. Anak=10, Ayah=40" },
        { q: "Mobil 180km. Jika speed +20km/jam, waktu hemat 1 jam. Kecepatan awal?", a: "180/v - 180/(v+20) = 1. Setelah dihitung, v = 60 km/jam." }
    ];

    let currentMode = [];
    let currentIndex = 0;

    // FUNGSI NAVIGASI
    function goHome() {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('home').classList.add('active');
    }

    function showTips(key) {
        const data = dataTips[key];
        document.getElementById('tips-title').innerText = data.title;
        document.getElementById('tips-content').innerHTML = data.steps.map(s => `<p>${s}</p>`).join('');
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-tips').classList.add('active');
    }

    function startLatihan(type) {
        currentMode = type === 'biasa' ? soalBiasa : soalCerita;
        currentIndex = 0;
        showSoal();
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-latihan').classList.add('active');
    }

    function showSoal() {
        const soal = currentMode[currentIndex];
        document.getElementById('progress-text').innerText = `Soal ${currentIndex + 1} / ${currentMode.length}`;
        document.getElementById('question-area').innerText = soal.q;
        document.getElementById('pembahasan-area').innerText = soal.a;
        document.getElementById('pembahasan-area').style.display = 'none';
    }

    // EVENT LISTENERS
    document.getElementById('btn-cek').onclick = () => {
        document.getElementById('pembahasan-area').style.display = 'block';
    };

    document.getElementById('btn-next').onclick = () => {
        if (currentIndex < currentMode.length - 1) {
            currentIndex++;
            showSoal();
        } else {
            alert("Sesi Selesai! Kamu hebat.");
            goHome();
        }
    };

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js')
        .then(() => console.log('SW registered!'))
        .catch(err => console.error('SW gagal:', err));
    }
</script>

</body>

</html>
